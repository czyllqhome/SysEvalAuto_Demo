[project]
name = "syseval-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0.30,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "pillow>=11,<13",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
